<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>البطل | قائمة الأسعار</title>
<meta name="theme-color" content="#0f2a5c"><meta name="description" content="Al-Batal price list for Bajaj RE 225 tuk-tuk spare parts | قائمة أسعار البطل لقطع غيار توكتوك باجاج RE 225"><link rel="canonical" href="https://albatal-eg.github.io/app/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../2-logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../2-logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a5c;--blue:#1d4fa8;--gold:#f5a400;--bg:#f4f6fb;--ink:#17233d}
*{box-sizing:border-box;margin:0}
body{font-family:'Cairo',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 14px}
.top{display:flex;align-items:center;gap:10px}
.top img{height:40px}.top b{flex:1;font-size:17px}
button{font:inherit;cursor:pointer}
.sm{background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:6px 12px;font-weight:800}
.ic{background:#ffffff22;color:#fff;border:0;border-radius:8px;padding:6px 10px}
#q{width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;border:0;font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid #cfd8ea;background:#fff;color:var(--navy);border-radius:20px;padding:6px 14px;font-weight:600}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#st{font-size:12px;color:#56637f;padding:0 14px 6px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:6px 14px}
.c{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(15,42,92,.08);display:flex;flex-direction:column}
.c img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#eef1f7}
.c .b{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.c h3{font-size:14px;line-height:1.35;color:var(--navy);flex:1}
.pr{font-weight:800;font-size:17px;color:var(--blue)}
.pr.na{font-size:13px;color:#56637f;font-weight:600}
.out{color:#b3261e;font-size:12px;font-weight:700}
.q{display:flex;align-items:center;justify-content:space-between;gap:6px}
.q button{width:34px;height:34px;border-radius:8px;border:0;background:var(--navy);color:#fff;font-size:20px;font-weight:800}
.q button:disabled{opacity:.3}
.q span{min-width:24px;text-align:center;font-weight:800}
.bar{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid #dfe5f1;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
.bar div{flex:1;font-weight:800;color:var(--navy)}
.wa{background:#25d366;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:800}
.wa:disabled{opacity:.4}
#sh{position:fixed;inset:0;background:rgba(10,29,64,.6);display:none;align-items:flex-end;z-index:20}
#sh.on{display:flex}
#sh .p{background:#fff;width:100%;max-width:560px;margin:auto;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
#sh img{width:100%;max-height:300px;object-fit:contain;background:#eef1f7;border-radius:12px}
#sh h2{font-size:20px;color:var(--navy);line-height:1.3}
#sh .row{display:flex;gap:8px}#sh .row>*{flex:1}
.ln{display:block;text-align:center;border-radius:10px;padding:12px;font-weight:800;border:2px solid var(--navy);color:var(--navy);background:#fff;text-decoration:none}
.foot{padding:18px 14px 6px;text-align:center;font-size:12px;color:#56637f}.foot a{color:var(--blue);font-weight:700}
.c img,.c h3{cursor:pointer}
.none{padding:30px;text-align:center;color:#56637f}
</style>
</head>
<body>
<header>
<div class="top"><img src="../2-logo.svg" alt=""><b id="ttl"></b><button class="ic" id="rf" title="refresh">&#8635;</button><button class="sm" id="ins" style="display:none"></button><button class="sm" id="lg">English</button></div>
<input id="q" type="search">
</header>
<div class="chips" id="chips"></div>
<div id="st"></div>
<div id="list"></div>
<div class="foot" id="ft"></div>
<div id="sh"><div class="p"><img id="si" alt=""><h2 id="sn"></h2><div class="pr" id="sp"></div><div class="q" id="sq"></div><div class="row"><a class="ln" id="sw" href="#"></a><button class="ln" id="ss"></button></div><button class="ln" id="sx"></button></div></div>
<div class="bar"><div id="sum"></div><button class="wa" id="wa"></button></div>
<script>
const SHEET="1w0CBjyokDwZUwU3ZY-waAyLhtvz8RUxCNyyEi22D9Pk";
const PRODUCTS=[{"id": "bearing_own", "cat": "bearings", "en": "AL BATAL Bearings 6204 and 6005", "ar": "رولمان البطل <bdi>6204</bdi> و <bdi>6005</bdi>", "img": "../6-img-bearing_own.jpg"}, {"id": "bearing_jtekt", "cat": "bearings", "en": "Ball Bearing 6204 2RS C3 (JTEKT / Koyo)", "ar": "رولمان <bdi>6204 2RS C3 (JTEKT / Koyo)</bdi>", "img": "../5-img-bearing_jtekt.jpg"}, {"id": "kit", "cat": "starter", "en": "Starter Repair Kit (armature with brush set)", "ar": "طقم صيانة مارش (أرميتشر مع طقم فحمات)", "img": "../14-img-kit.jpg"}, {"id": "bendix1", "cat": "starter", "en": "Starter Bendix Drives, boxed", "ar": "بندكس مارش مع العلبة", "img": "../7-img-bendix1.jpg"}, {"id": "bendix2", "cat": "starter", "en": "Starter Bendix Drive", "ar": "بندكس المارش", "img": "../8-img-bendix2.jpg"}, {"id": "bendix3", "cat": "starter", "en": "Starter Bendix Drive (side view)", "ar": "بندكس مارش (منظر جانبي)", "img": "../9-img-bendix3.jpg"}, {"id": "arm1", "cat": "starter", "en": "Starter Armature", "ar": "أرميتشر المارش", "img": "../3-img-arm1.jpg"}, {"id": "arm2", "cat": "starter", "en": "Starter Armature, copper commutator", "ar": "أرميتشر المارش بكوليكتور نحاس", "img": "../4-img-arm2.jpg"}, {"id": "brush", "cat": "starter", "en": "Brush Plate and End Cover", "ar": "غطاء المارش مع حامل الفحمات", "img": "../10-img-brush.jpg"}, {"id": "cover", "cat": "starter", "en": "Starter Front Cover", "ar": "الغطاء الأمامي للمارش", "img": "../11-img-cover.jpg"}, {"id": "coverside", "cat": "starter", "en": "Starter Cover (side view)", "ar": "غطاء المارش (منظر جانبي)", "img": "../12-img-coverside.jpg"}, {"id": "endcup", "cat": "starter", "en": "Starter End Cup", "ar": "الغطاء الخلفي للمارش", "img": "../13-img-endcup.jpg"}, {"id": "yoke", "cat": "starter", "en": "Starter Yoke (magnet housing) with Ring", "ar": "جسم المارش بالمغناطيس مع الحلقة", "img": "../21-img-yoke.jpg"}, {"id": "shell", "cat": "starter", "en": "Starter Yoke Shell", "ar": "جسم المارش الخارجي", "img": "../17-img-shell.jpg"}, {"id": "ten1", "cat": "tensioners", "en": "Bajaj Chain Tensioner DS101277", "ar": "شداد جنزير باجاج <bdi>DS101277</bdi>", "img": "../19-img-ten1.jpg"}, {"id": "ten2", "cat": "tensioners", "en": "Chain Tensioner, RE pack", "ar": "شداد جنزير، عبوة <bdi>RE</bdi>", "img": "../20-img-ten2.jpg"}, {"id": "spring", "cat": "tensioners", "en": "Spring and Seal Set", "ar": "طقم سوستة وجلدة", "img": "../18-img-spring.jpg"}, {"id": "plug5", "cat": "plugs", "en": "Spark Plugs, 5 Types (A7TC to F7TC)", "ar": "بوجيهات، 5 أنواع (<bdi>A7TC</bdi> إلى <bdi>F7TC</bdi>)", "img": "../16-img-plug5.jpg"}, {"id": "plug3", "cat": "plugs", "en": "Spark Plugs A7TC, CR8E, D8TC", "ar": "بوجيهات <bdi>A7TC</bdi> و <bdi>CR8E</bdi> و <bdi>D8TC</bdi>", "img": "../15-img-plug3.jpg"}];
const CATS=[{"id": "bearings", "en": "Bearings, our own brand", "ar": "رولمانات، ماركة البطل"}, {"id": "starter", "en": "Starter parts", "ar": "قطع المارش"}, {"id": "tensioners", "en": "Tensioners and fittings", "ar": "شدادات وملحقات"}, {"id": "plugs", "en": "Spark plugs", "ar": "بوجيهات"}];
const WA="201097811176";
const T={ar:{ttl:"البطل | قائمة الأسعار",q:"دوّر على قطعة...",all:"الكل",egp:"جنيه",ask:"اسأل عن السعر",out:"غير متوفر",wa:"اطلب على الواتساب",items:"قطعة",total:"الإجمالي",none:"مفيش نتائج",upd:"آخر تحديث للأسعار",off:"الأسعار من آخر تحديث محفوظ",hello:"أهلاً، عايز أطلب من البطل:",tot:"الإجمالي",unp:"السعر بالاتفاق",pcs:"قطعة"},
en:{ttl:"Al-Batal | Price list",q:"Search a part...",all:"All",egp:"EGP",ask:"Ask for price",out:"Out of stock",wa:"Order on WhatsApp",items:"items",total:"Total",none:"No results",upd:"Prices updated",off:"Showing last saved prices",hello:"Hello, I would like to order from Al-Batal:",tot:"Total",unp:"price on request",pcs:"pcs"}};
let lang=localStorage.getItem('lang')||'ar';
let cat='all',qs='',prices={},stamp=null,offline=false;
let cart=JSON.parse(localStorage.getItem('cart')||'{}');
const $=id=>document.getElementById(id);
const nm=p=>p[lang];
function csv(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
const num=v=>{v=String(v||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫]/g,'.').replace(/[^0-9.]/g,'');return v&&!isNaN(v)?parseFloat(v):null};
const outOf=v=>/^(no|n|0|x|لا|لأ|غير متوفر|خلص|خالص)$/i.test(String(v||'').trim());
function parse(text){const m={};csv(text).slice(1).forEach(r=>{const id=(r[0]||'').trim();if(!id)return;m[id]={price:num(r[3]),out:outOf(r[4])}});return m}
async function load(){
 try{const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv&sheet=Prices&_=${Date.now()}`,{cache:'no-store'});
  if(!r.ok)throw 0;const t=await r.text();prices=parse(t);stamp=new Date();offline=false;
  localStorage.setItem('prices',JSON.stringify({p:prices,t:stamp.toISOString()}))}
 catch(e){const s=JSON.parse(localStorage.getItem('prices')||'null');if(s){prices=s.p;stamp=new Date(s.t)}offline=true}
 draw()}
const fmt=n=>n.toLocaleString(lang=='ar'?'ar-EG':'en-US',{maximumFractionDigits:2});
function save(){localStorage.setItem('cart',JSON.stringify(cart))}
function chg(id,d){const n=Math.max(0,(cart[id]||0)+d);if(n)cart[id]=n;else delete cart[id];save();draw(true)}
function draw(keep){
 const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
 $('ttl').textContent=t.ttl;$('q').placeholder=t.q;$('lg').textContent=lang=='ar'?'English':'عربي';$('wa').textContent=t.wa;document.title=t.ttl;
 $('chips').innerHTML=[{id:'all',[lang]:t.all},...CATS].map(c=>`<button class="chip ${cat==c.id?'on':''}" data-c="${c.id}">${c[lang]}</button>`).join('');
 $('st').textContent=stamp?((offline?t.off:t.upd)+': '+stamp.toLocaleString(lang=='ar'?'ar-EG':'en-GB',{dateStyle:'medium',timeStyle:'short'})):'';
 const ql=qs.trim().toLowerCase();
 const L=PRODUCTS.filter(p=>(cat=='all'||p.cat==cat)&&(!ql||(p.en+' '+p.ar.replace(/<[^>]+>/g,'')).toLowerCase().includes(ql)));
 $('list').innerHTML=L.length?L.map(p=>{const x=prices[p.id]||{};const has=x.price!=null;const n=cart[p.id]||0;
  return `<div class="c"><img src="${p.img}" alt="" loading="lazy"><div class="b"><h3>${nm(p)}</h3>
  ${x.out?`<div class="out">${t.out}</div>`:''}
  <div class="pr ${has?'':'na'}">${has?fmt(x.price)+' '+t.egp:t.ask}</div>
  <div class="q"><button data-d="1" data-i="${p.id}" ${x.out?'disabled':''}>+</button><span>${n}</span><button data-d="-1" data-i="${p.id}" ${n?'':'disabled'}>&minus;</button></div></div></div>`}).join(''):`<div class="none">${t.none}</div>`;
 let cnt=0,tot=0,unp=false;for(const id in cart){cnt+=cart[id];const x=prices[id];if(x&&x.price!=null)tot+=x.price*cart[id];else unp=true}
 $('sum').textContent=cnt?`${cnt} ${t.items}`+(tot?` · ${t.total}: ${fmt(tot)} ${t.egp}`:''):'';
 $('wa').disabled=!cnt}
$('chips').onclick=e=>{const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;draw()}};
$('list').onclick=e=>{const b=e.target.closest('[data-i]');if(b)chg(b.dataset.i,+b.dataset.d)};
$('q').oninput=e=>{qs=e.target.value;const f=document.activeElement;draw();};
$('lg').onclick=()=>{lang=lang=='ar'?'en':'ar';localStorage.setItem('lang',lang);draw()};
$('rf').onclick=load;
$('wa').onclick=()=>{const t=T[lang];let tot=0,unp=false;const lines=Object.keys(cart).map(id=>{const p=PRODUCTS.find(x=>x.id==id),x=prices[id]||{},n=cart[id];
 if(x.price!=null){tot+=x.price*n;return `- ${nm(p)} x${n} = ${fmt(x.price*n)} ${t.egp}`}unp=true;return `- ${nm(p)} x${n} (${t.unp})`});
 const msg=t.hello+'\n'+lines.join('\n')+(tot?`\n${t.tot}: ${fmt(tot)} ${t.egp}`+(unp?' +':''):'');
 location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg)};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const sv=JSON.parse(localStorage.getItem('prices')||'null');if(sv){prices=sv.p;stamp=new Date(sv.t);offline=true}
let open_=null;
function detail(id){open_=id;const p=PRODUCTS.find(x=>x.id==id),x=prices[id]||{},t=T[lang];
 $('si').src=p.img;$('sn').innerHTML=nm(p);
 $('sp').className='pr '+(x.price!=null?'':'na');$('sp').textContent=x.out?t.out:(x.price!=null?fmt(x.price)+' '+t.egp:t.ask);
 const n=cart[id]||0;$('sq').innerHTML=`<button data-d="1" data-i="${id}" ${x.out?'disabled':''}>+</button><span>${n}</span><button data-d="-1" data-i="${id}" ${n?'':'disabled'}>&minus;</button>`;
 const plain=nm(p).replace(/<[^>]+>/g,'');
 $('sw').textContent=lang=='ar'?'اسأل على واتساب':'Ask on WhatsApp';$('sw').href='https://wa.me/'+WA+'?text='+encodeURIComponent((lang=='ar'?'أهلاً، عايز أسأل عن: ':'Hello, I would like to ask about: ')+plain);
 $('ss').textContent=lang=='ar'?'مشاركة':'Share';$('ss').onclick=()=>{const d={title:'Al-Batal',text:plain,url:location.href};navigator.share?navigator.share(d).catch(()=>{}):navigator.clipboard&&navigator.clipboard.writeText(location.href)};
 $('sx').textContent=lang=='ar'?'إغلاق':'Close';$('sh').classList.add('on')}
$('sx').onclick=()=>{open_=null;$('sh').classList.remove('on')};
$('sh').onclick=e=>{if(e.target==$('sh')){open_=null;$('sh').classList.remove('on')}};
$('sq').onclick=e=>{const b=e.target.closest('[data-i]');if(b){chg(b.dataset.i,+b.dataset.d);detail(open_)}};
$('list').addEventListener('click',e=>{if(e.target.closest('[data-i]'))return;const c=e.target.closest('.c');if(!c)return;const i=PRODUCTS.findIndex(p=>c.querySelector('img').getAttribute('src')==p.img);if(i>=0)detail(PRODUCTS[i].id)});
let dip=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('ins').style.display='';$('ins').textContent=lang=='ar'?'تثبيت':'Install'});
$('ins').onclick=async()=>{if(dip){dip.prompt();dip=null;$('ins').style.display='none'}};
const _d=draw;draw=function(k){_d(k);$('ft').innerHTML=lang=='ar'?'شركة البطل للاستيراد والتجارة · <a href="../">الموقع</a> · <a href="https://wa.me/'+WA+'">واتساب</a>':'Al-Batal Import and Trade Company · <a href="../">Website</a> · <a href="https://wa.me/'+WA+'">WhatsApp</a>'};
draw();load();
</script>
</body></html>
